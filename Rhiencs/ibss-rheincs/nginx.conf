# Nginx configuration for Next.js static export
# Place this in your Nginx server block or include it

server {
    # ... your existing server configuration ...

    # Serve static files
    root /path/to/your/out;
    index index.html;

    # Handle 404 errors - serve 404.html which contains client-side routing
    error_page 404 /404.html;
    
    # Ensure 404.html is served with 200 status (not 404)
    location = /404.html {
        internal;
    }

    # For all routes, try to serve the file, if not found, serve 404.html
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Specific handling for detail page routes
    location ~ ^/(blog-details|Case-study-details|news-events|openings)/ {
        try_files $uri $uri/ $uri.html /404.html;
    }
}

